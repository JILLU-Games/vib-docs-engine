        - heading "Overview" [level=1] [ref=f4e45]
        - generic [ref=f4e46]:
          - heading "Operating vib-docs-engine" [level=1] [ref=f4e47]
          - paragraph [ref=f4e48]:
            - code [ref=f4e49]: vib-docs-engine
            - text: builds static documentation portals for multiple products. Configuration selects the portal identity and product repositories. During a build, the engine fetches only configured documentation directories with Git sparse checkout, validates and normalizes content, generates a manifest/sidebar tree, and then builds Astro static pages and a local Pagefind search index.
          - paragraph [ref=f4e50]: Phase 2 provides the Astro/Tailwind configuration, Content Collection schema, and sync/manifest engine. UI routes are intentionally deferred to Phases 3 and 4. Until those routes exist, Astro builds zero pages and Pagefind cannot create a meaningful index.
          - heading "Prerequisites for the implemented engine" [level=2] [ref=f4e51]
          - list [ref=f4e52]:
            - listitem [ref=f4e53]: A Node.js release supported by the installed Astro version and npm.
            - listitem [ref=f4e54]: Git with sparse-checkout support (Git 2.25 or newer).
            - listitem [ref=f4e55]: Network access to the configured source repositories; credentials only when private repositories require them.
          - heading "Local workflow" [level=2] [ref=f4e56]
          - list [ref=f4e57]:
            - listitem [ref=f4e58]:
              - text: Install dependencies using
              - code [ref=f4e59]: npm install
              - text: (or
              - code [ref=f4e60]: npm ci
              - text: from the lockfile in CI).
            - listitem [ref=f4e61]:
              - text: Set
              - code [ref=f4e62]: GIT_TOKEN
              - text: in the process environment or deployment secret store when private HTTPS repositories require it. Set
              - code [ref=f4e63]: GIT_USERNAME
              - text: only when the Git host requires a different token username. Never commit credentials or put them in public build variables.
            - listitem [ref=f4e64]:
              - text: Run
              - code [ref=f4e65]: npm run sync
              - text: to synchronize docs and regenerate
              - code [ref=f4e66]: src/generated/manifest.json
              - text: .
            - listitem [ref=f4e67]:
              - text: Run
              - code [ref=f4e68]: npm run dev
              - text: to sync automatically, then start Astro’s development server.
            - listitem [ref=f4e69]:
              - text: Run
              - code [ref=f4e70]: npm run build
              - text: to sync, build Astro, and run Pagefind.
              - code [ref=f4e71]: npm run preview
              - text: previews an existing Astro build.
          - paragraph [ref=f4e72]:
            - text: The
            - code [ref=f4e73]: predev
            - text: and
            - code [ref=f4e74]: prebuild
            - text: lifecycle hooks run the sync script automatically.
            - code [ref=f4e75]: localPath
            - text: can temporarily target a local folder (for example
            - code [ref=f4e76]: ./docs
            - text: ) for an isolated sync test; keep it out of production config. Generated content and manifests are ignored build inputs and must not be hand-edited. During UI implementation, add routes before expecting Pagefind to find HTML pages.
          - heading "Configuration overview" [level=2] [ref=f4e77]
          - list [ref=f4e78]:
            - listitem [ref=f4e79]:
              - code [ref=f4e80]: config/site.config.json
              - text: controls portal title, subtitle, canonical domain, brand identity, default accent, and navigation.
            - listitem [ref=f4e81]:
              - code [ref=f4e82]: config/projects.json
              - text: lists products, categories, Git remotes, branches, docs paths, accents, CTA destinations, and optional metadata fallbacks.
            - listitem [ref=f4e83]: Categories are derived from configured products. Adding a category does not require code changes.
          - paragraph [ref=f4e84]:
            - text: Synchronized files under
            - code [ref=f4e85]: src/content/docs/
            - text: ", generated data under"
            - code [ref=f4e86]: src/generated/
            - text: ", and synchronized logos under"
            - code [ref=f4e87]: public/logos/
            - text: are build artifacts and are ignored by Git except for
            - code [ref=f4e88]: .gitkeep
            - text: files. Do not edit generated files by hand.
          - heading "Deployment" [level=2] [ref=f4e89]
          - paragraph [ref=f4e90]: Configure the host to build from the portal’s own deployment repository. A documentation source repository webhook should trigger the host’s protected build hook; the build fetches current source content and publishes a complete static output. For Cloudflare Pages, use its build hook. For a Docker/Nginx VPS, use a protected receiver/CI pipeline and have Nginx serve only the finished static directory. The receiver must verify webhook authenticity and avoid exposing a shell command publicly. Build into staging and replace live output only after all build steps succeed.
          - paragraph [ref=f4e91]:
            - text: See
            - link "Adding Projects" [ref=f4e92] [cursor=pointer]:
              - /url: adding-projects.md
            - text: for product setup and webhook steps, and the architecture/feature specifications in
            - code [ref=f4e93]: project/
            - text: for the implementation contract.
