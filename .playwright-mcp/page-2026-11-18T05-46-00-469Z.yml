        - generic [ref=f5e44]:
          - heading "Operating vib-docs-engine" [level=1] [ref=f5e45]
          - paragraph [ref=f5e46]:
            - code [ref=f5e47]: vib-docs-engine
            - text: builds static documentation portals for multiple products. Configuration selects the portal identity and product repositories. During a build, the engine fetches only configured documentation directories with Git sparse checkout, validates and normalizes content, generates a manifest/sidebar tree, and then builds Astro static pages and a local Pagefind search index.
          - paragraph [ref=f5e48]: Phase 2 provides the Astro/Tailwind configuration, Content Collection schema, and sync/manifest engine. UI routes are intentionally deferred to Phases 3 and 4. Until those routes exist, Astro builds zero pages and Pagefind cannot create a meaningful index.
          - heading "Prerequisites for the implemented engine" [level=2] [ref=f5e49]
          - list [ref=f5e50]:
            - listitem [ref=f5e51]: A Node.js release supported by the installed Astro version and npm.
            - listitem [ref=f5e52]: Git with sparse-checkout support (Git 2.25 or newer).
            - listitem [ref=f5e53]: Network access to the configured source repositories; credentials only when private repositories require them.
          - heading "Local workflow" [level=2] [ref=f5e54]
          - list [ref=f5e55]:
            - listitem [ref=f5e56]:
              - text: Install dependencies using
              - code [ref=f5e57]: npm install
              - text: (or
              - code [ref=f5e58]: npm ci
              - text: from the lockfile in CI).
            - listitem [ref=f5e59]:
              - text: Set
              - code [ref=f5e60]: GIT_TOKEN
              - text: in the process environment or deployment secret store when private HTTPS repositories require it. Set
              - code [ref=f5e61]: GIT_USERNAME
              - text: only when the Git host requires a different token username. Never commit credentials or put them in public build variables.
            - listitem [ref=f5e62]:
              - text: Run
              - code [ref=f5e63]: npm run sync
              - text: to synchronize docs and regenerate
              - code [ref=f5e64]: src/generated/manifest.json
              - text: .
            - listitem [ref=f5e65]:
              - text: Run
              - code [ref=f5e66]: npm run dev
              - text: to sync automatically, then start Astro’s development server.
            - listitem [ref=f5e67]:
              - text: Run
              - code [ref=f5e68]: npm run build
              - text: to sync, build Astro, and run Pagefind.
              - code [ref=f5e69]: npm run preview
              - text: previews an existing Astro build.
          - paragraph [ref=f5e70]:
            - text: The
            - code [ref=f5e71]: predev
            - text: and
            - code [ref=f5e72]: prebuild
            - text: lifecycle hooks run the sync script automatically.
            - code [ref=f5e73]: localPath
            - text: can temporarily target a local folder (for example
            - code [ref=f5e74]: ./docs
            - text: ) for an isolated sync test; keep it out of production config. Generated content and manifests are ignored build inputs and must not be hand-edited. During UI implementation, add routes before expecting Pagefind to find HTML pages.
          - heading "Configuration overview" [level=2] [ref=f5e75]
          - list [ref=f5e76]:
            - listitem [ref=f5e77]:
              - code [ref=f5e78]: config/site.config.json
              - text: controls portal title, subtitle, canonical domain, brand identity, default accent, and navigation.
            - listitem [ref=f5e79]:
              - code [ref=f5e80]: config/projects.json
              - text: lists products, categories, Git remotes, branches, docs paths, accents, CTA destinations, and optional metadata fallbacks.
            - listitem [ref=f5e81]: Categories are derived from configured products. Adding a category does not require code changes.
          - paragraph [ref=f5e82]:
            - text: Synchronized files under
            - code [ref=f5e83]: src/content/docs/
            - text: ", generated data under"
            - code [ref=f5e84]: src/generated/
            - text: ", and synchronized logos under"
            - code [ref=f5e85]: public/logos/
            - text: are build artifacts and are ignored by Git except for
            - code [ref=f5e86]: .gitkeep
            - text: files. Do not edit generated files by hand.
          - heading "Deployment" [level=2] [ref=f5e87]
          - paragraph [ref=f5e88]: Configure the host to build from the portal’s own deployment repository. A documentation source repository webhook should trigger the host’s protected build hook; the build fetches current source content and publishes a complete static output. For Cloudflare Pages, use its build hook. For a Docker/Nginx VPS, use a protected receiver/CI pipeline and have Nginx serve only the finished static directory. The receiver must verify webhook authenticity and avoid exposing a shell command publicly. Build into staging and replace live output only after all build steps succeed.
          - paragraph [ref=f5e89]:
            - text: See
            - link "Adding Projects" [ref=f5e90] [cursor=pointer]:
              - /url: adding-projects.md
            - text: for product setup and webhook steps, and the architecture/feature specifications in
            - code [ref=f5e91]: project/
            - text: for the implementation contract.
